services:
  insec_des_lab:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      # Allow Docker port forwarding; the published port is restricted to host loopback.
      - FLASK_RUN_HOST=0.0.0.0
    restart: unless-stopped
